        volumeMounts:
        - name: config
          mountPath: /opt/open5gs/etc/open5gs/upf.yaml
          subPath: upf.yaml
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
      volumes:
      - name: config
        configMap:
          name: open5gs-upf
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: ogstun
        image: docker.io/gradiant/open5gs:2.8.0
        command:
        - /bin/bash
        - -c
        - |
          set -e
          # Idempotent: with hostNetwork, ogstun and the NAT rule stay on the host across pod restarts.
          ip link show ogstun >/dev/null 2>&1 || ip tuntap add name ogstun mode tun
          ip link set ogstun up
          ip link set dev ogstun txqueuelen 4096
          ip addr replace 10.45.0.1/16 dev ogstun
          sysctl -w net.ipv4.ip_forward=1
          iptables -t nat -C POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE 2>/dev/null || \
            iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
          echo "ogstun ready: $(ip -4 -br addr show ogstun)"
        securityContext:
          privileged: true
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
