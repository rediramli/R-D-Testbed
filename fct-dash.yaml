apiVersion: apps/v1
kind: Deployment
metadata:
  name: fct-dash
  namespace: fct-dash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fct-dash
  template:
    metadata:
      labels:
        app: fct-dash
      annotations:
        fct-dash/code-hash: "CODE_HASH"
    spec:
      serviceAccountName: fct-dash-reader
      containers:
      - name: dash
        image: python:3.12-alpine
        command: ["python", "/app/app.py"]
        env:
        - name: RADIO_MODE
          value: rfsim
        - name: CAPTURE_URL
          value: http://10.0.129.7:8091
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONUNBUFFERED
          value: "1"
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 5
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
        - name: ran
          mountPath: /etc/fct-dash/ran
          readOnly: true
        - name: ctl
          mountPath: /etc/fct-dash/ctl
          readOnly: true
        - name: admin
          mountPath: /etc/fct-dash/admin
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: fct-dash-app
      - name: ran
        secret:
          secretName: fct-dash-ran
      - name: ctl
        secret:
          secretName: fct-dash-ctl
          optional: true
      - name: admin
        secret:
          secretName: fct-dash-admin
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: fct-dash
  namespace: fct-dash
spec:
  type: NodePort
  selector:
    app: fct-dash
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30880
